<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zameel founders</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form" novalidate>
    <img class="login-logo" src="/assets/brand/zameel-logo-full-colour.svg" alt="Zameel" width="150" height="48">
    <h1>Founders sign in</h1>
    <p class="login-sub">Clients, contracts, money and pipeline in one place. For the five of us only.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit" id="login-submit">Sign in</button>
  </form>
</main>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side-logo" href="#overview"><img src="/assets/brand/zameel-logo-white.svg" alt="Zameel" width="120" height="39"></a>
    <nav class="side-nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="side-user" id="side-user"></span>
      <button class="side-out" id="sign-out" type="button">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="top-title"><h1 id="page-title">Overview</h1><p id="page-desc"></p></div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <div class="banner" id="demo-banner" hidden>
      <b>Preview with made-up data.</b> The database isn't connected yet, so nothing you change here is saved.
    </div>
    <div class="content" id="content" tabindex="-1"></div>
  </div>
</div>

<!-- Edit drawer -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <form id="drawer-form" novalidate>
    <header class="drawer-head">
      <h2 id="drawer-title">Edit</h2>
      <button class="icon-btn" type="button" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer class="drawer-foot">
      <button class="btn btn-danger" type="button" id="drawer-delete">Delete</button>
      <span class="drawer-confirm" id="drawer-confirm" hidden>Delete for good? <button class="btn btn-danger" type="button" id="drawer-delete-yes">Yes, delete</button></span>
      <span class="grow"></span>
      <button class="btn" type="button" id="drawer-cancel">Cancel</button>
      <button class="btn btn-primary" type="submit" id="drawer-save">Save</button>
    </footer>
  </form>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/api/admin-config"></script>
<script src="/assets/js/admin-demo.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
